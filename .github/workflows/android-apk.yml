name: Build Android APK

on:
  push:
    branches: ["**"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Build debug APK
        id: build
        continue-on-error: false
        run: |
          set -o pipefail
          gradle :app:assembleDebug --stacktrace --console=plain 2>&1 | tee ../build-output.log
          exit ${PIPESTATUS[0]}

      - name: Extract compiler errors
        if: always()
        run: |
          echo "===== COMPILER ERRORS ====="
          grep -E -i '(^e: |error:|unresolved reference|type mismatch|expecting |conflicting overloads|FAILURE:|What went wrong)' ../build-output.log || true
          echo "===== END COMPILER ERRORS ====="

      - name: Upload build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: brawl-competitive-build-diagnostics
          path: build-output.log
          if-no-files-found: warn

      - name: Upload APK
        if: steps.build.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: brawl-competitive-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Fail workflow when compilation failed
        if: steps.build.outcome != 'success'
        run: exit 1
