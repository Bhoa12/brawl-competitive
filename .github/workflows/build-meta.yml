name: Build competitive meta

on:
  workflow_dispatch:
  schedule:
    - cron: "17 */6 * * *"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Build meta document
        run: |
          cd backend
          node src/runBuild.js
      - name: Commit generated meta
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/public/meta.json
          git diff --cached --quiet || git commit -m "Update competitive meta snapshot"
          git push
